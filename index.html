<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Barbershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap&subset=latin,latin-ext,cyrillic" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --paper:#F4F6F8; --card:#fff; --ink:#14223A; --on-ink:#fff; --muted:#667489; --line:#DDE3EA;
  --red:#C62F2F; --blue:#1F4E9C; --ok:#2E7D4F;
  --red-bg:#FBE9E9; --blue-bg:#E7EEF9; --ok-bg:#E6F3EB; --grey-bg:#ECEFF3; --stripe-w:#fff;
  --pole:repeating-linear-gradient(-45deg,#C62F2F 0 10px,var(--stripe-w) 10px 20px,#1F4E9C 20px 30px,var(--stripe-w) 30px 40px);
  color-scheme:light;
}
[data-theme=dark]{
  --paper:#16191F; --card:#20242C; --ink:#EEF1F5; --on-ink:#14223A; --muted:#9AA5B5; --line:#2F3540;
  --red:#F07C75; --blue:#7FA8EE; --ok:#5CC48A;
  --red-bg:rgba(240,124,117,.14); --blue-bg:rgba(127,168,238,.14); --ok-bg:rgba(92,196,138,.14); --grey-bg:#2A2F38; --stripe-w:#CBD3DF;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(170px + env(safe-area-inset-bottom))}

.bar{position:sticky;top:0;height:6px;background:var(--line);margin:0 -16px;z-index:5}
.bar i{display:block;height:100%;background:var(--pole);transition:width .35s ease}

.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b,.ttl{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--blue);flex:0 0 auto}
.logo.ph{display:grid;place-items:center;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.tools{display:flex;gap:2px;flex:0 0 auto}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted);text-align:center;flex:0 0 auto}
.ib.txt{font-weight:700;font-size:14px;color:var(--ink)}
.ib:active{background:var(--grey-bg)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.s{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1.05;margin:20px 0 6px}
h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:24px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.svc:active{background:var(--blue-bg)}
.svc b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.svc small{color:var(--muted);font-size:14px}
.svc em{font-style:normal;font-weight:600;white-space:nowrap}

.bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;cursor:pointer}
.bcard:active{background:var(--blue-bg)}
.bcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--grey-bg)}
.bbody{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.pinbox{flex:0 0 44px;height:44px;border-radius:12px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center}
.bbody b{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:600;line-height:1.1;display:block}
.maplink{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;margin-top:8px;padding:4px 0}

.strip{display:flex;gap:8px;overflow-x:auto;margin:8px -16px 18px;padding:2px 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:58px;padding:8px 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip b{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip.on small{color:var(--on-ink);opacity:.7}
.pills{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 12px;padding:2px 16px;scrollbar-width:none}
.pill{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;text-align:center}
.pill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:12px 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px;font-weight:600}
.slot.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

.empty{padding:24px 8px;text-align:center;color:var(--muted)}
.empty .primary{margin-top:14px;max-width:240px;margin-left:auto;margin-right:auto;display:block}

.act{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),var(--paper) 40%);z-index:6;pointer-events:none}
.act.hn{bottom:calc(58px + env(safe-area-inset-bottom));padding-bottom:10px}
.act>div{max-width:520px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.primary{flex:1;height:52px;border-radius:12px;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:17px;text-align:center}
.primary:disabled{opacity:.35}
.ghost{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.small-btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;text-align:center}
.small-btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.small-btn.no{background:var(--red-bg);border-color:transparent;color:var(--red)}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.nav>div{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500;text-align:center}
.nav button.on{color:var(--blue);font-weight:600}

.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--grey-bg);color:var(--muted);white-space:nowrap}
.tag.booked{background:var(--blue-bg);color:var(--blue)}
.tag.done{background:var(--ok-bg);color:var(--ok)}
.tag.no_show{background:var(--red-bg);color:var(--red)}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.time{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1}
.line{margin-top:6px}
.line a{color:var(--blue);text-decoration:none;font-weight:600}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.bk .sv{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:600;line-height:1.1}
.bk .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;color:var(--muted)}
.bk .meta span{display:inline-flex;align-items:center;gap:6px}
.st{font-weight:600}
.st.booked{color:var(--blue)}.st.done{color:var(--ok)}.st.no_show,.st.cancelled{color:var(--red)}

.seg{display:flex;background:var(--grey-bg);border-radius:12px;padding:3px;margin:14px 0}
.seg button{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.big{font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:700;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid2 .card{margin:0}
.grid2 b{font-family:'Barlow Condensed',sans-serif;font-size:32px;line-height:1;display:block}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}

.hours{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hours:first-child{border-top:0}
.hours .t{display:flex;gap:8px;align-items:center}
.hours input[type=time]{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--card)}
.hours input[type=time]:disabled{opacity:.35}
.hours label{grid-column:2;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.hours input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}

.linkbox{word-break:break-all;background:var(--grey-bg);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}

.infocard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;color:inherit;text-decoration:none}
.infocard .pinbox{flex:0 0 40px;height:40px;border-radius:10px}
.infocard div{padding-top:8px;font-weight:500}
.about{white-space:pre-line;color:var(--muted);margin:14px 2px 0}
.hero{display:grid;place-items:center;background:var(--blue);border-radius:16px;padding:22px}
.hero img{width:140px;height:140px;object-fit:contain}
.mapframe{width:100%;height:260px;border:0;border-radius:14px;margin-top:10px;background:var(--grey-bg)}
.maps{display:flex;gap:8px;margin-top:10px}.maps .ghost{flex:1}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sheet>div{width:100%;max-width:520px;margin:0 auto;background:var(--paper);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.sheet label{display:block;font-weight:600;margin:12px 0 4px}
.sheet input[type=text],.sheet input[type=number],.sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);height:46px}
.sheet textarea{height:96px;padding:10px 12px;resize:vertical}
.sheet .hint{color:var(--muted);font-size:13px;margin-top:4px}
.sheet .prev{display:block;max-width:100%;max-height:150px;border-radius:12px;margin:8px 0;object-fit:cover}
.sheet input[type=file]{width:100%;margin-top:4px}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;max-width:488px;margin:0 auto;background:var(--ink);color:var(--on-ink);padding:12px 14px;border-radius:12px;z-index:30;font-weight:500}
.toast.err{background:var(--red);color:#fff}

.done-mark{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:40px 0 8px}
.done-mark svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.center{padding-top:28vh;text-align:center}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--grey-bg);flex:0 0 auto}
.row{display:flex;gap:12px;align-items:flex-start}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center}.cal small{color:var(--muted);padding:6px 0}
.cd{height:42px;border-radius:10px;text-align:center;font-weight:600}.cd.dis{opacity:.3}.cd.on{background:var(--ink);color:var(--on-ink)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bgrid .bcard{margin:0}.bgrid .bbody{display:block;padding:12px}.bgrid b{font-family:'Barlow Condensed',sans-serif;font-size:24px;display:block}
.bgrid img,.bgrid .noimg{aspect-ratio:1/1;width:100%;object-fit:cover;background:var(--grey-bg);display:block}
.svc.on{border-color:var(--blue);background:var(--blue-bg)}.hrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.hrow b{font-family:'Barlow Condensed',sans-serif;font-size:28px}.hrow:disabled{opacity:.4}.hrow.on{border-color:var(--blue)}.hrow .busy{color:var(--red);font-weight:600}
.act>div{flex-wrap:wrap}.sum{width:100%;font-weight:600}.sum small{display:block;color:var(--muted);font-weight:400}
.ph input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);margin-top:8px}
.pend{background:#F59E0B;color:#fff;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:40px auto 12px}.pend svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tag.pending{background:#FFF1D6;color:#B26A00}.st.pending{color:#B26A00}
.sheet select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:inherit;font:inherit}
.slot.off{opacity:.35;text-decoration:line-through}.slot.cov{background:var(--blue-bg);border-color:var(--blue)}
</style>
</head>

// accepts: "41.31, 69.27", Google Maps links (@lat,lng / q=lat,lng / !3d..!4d..), Yandex links (ll= / pt= : lng,lat)
function parseCoords(s) {
  s = (s || "").trim();
  if (!s) return {empty: true};
  const N = "(-?\\d+(?:\\.\\d+)?)";
  let m;
  m = s.match(new RegExp("@" + N + ",\\s*" + N)); if (m) return {lat: +m[1], lng: +m[2]};
  m = s.match(new RegExp("!3d" + N + "!4d" + N)); if (m) return {lat: +m[1], lng: +m[2]};
  m = s.match(new RegExp("[?&](?:q|query|destination)=" + N + "(?:,|%2C)\\s*" + N, "i")); if (m) return {lat: +m[1], lng: +m[2]};
  m = s.match(new RegExp("[?&](?:ll|pt)=" + N + "(?:,|%2C)" + N, "i")); if (m) return {lat: +m[2], lng: +m[1]};
  m = s.match(new RegExp("^" + N + "\\s*[, ]\\s*" + N + "$"));
  if (m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) return {lat: +m[1], lng: +m[2]};
  return null;
}

function fileToDataUrl(file, maxW, type, q) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const ctx = c.getContext("2d");
      if (type === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL(type, q));
    };
    img.onerror = rej;
    img.src = url;
  });
}

async function api(path, opts) {
  opts = opts || {};

    res = await fetch(API_BASE + path, {
      method: opts.method || "GET",
      headers: {"Content-Type": "application/json", "X-Init-Data": (tg && tg.initData) || ""},
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (e) { throw new Error("network"); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    let msg = data && data.detail;
    if (!msg || typeof msg !== "string") msg = "server_error";
    throw new Error(msg);
  }
  return data;
}

function render() { render0(); if (S.lang === "ru") ruTree($app); }
function render0() {
  if (!S.shop) return;
  const staff = isStaff();
  const v = S.view;
  let head = "", body = "", act = "", pct = 100;

  if (v === "home") {
    if (S.done) { head = hdHome(); body = viewDone(); act = '<button class="primary" data-a="close-app">' + t("close") + '</button><button class="primary" data-a="view" data-v="mine">' + t("my_bookings") + "</button>"; }
    else if (S.step === 1) { head = hdHome(); body = viewBranches(); pct = 15; }
    else if (S.step === 2) { head = hdSub(nm(S.branch), "back"); body = viewBarbers(); pct = 30; }
    else if (S.step === 3) {
      const T = totals(); head = hdSub(nm(S.barber), "back"); body = viewServices(); pct = 45;
      act = T.p.length ? '<div class="sum">' + money(T.price) + "<small>" + t("minutes", {n: T.min}) + " · " + t("svc_n", {n: T.p.length}) + "</small></div>" : "";
      act += '<button class="primary" data-a="to-cal"' + (T.p.length ? "" : " disabled") + ">" + t("next") + "</button>";
    }
    else if (S.step === 4) { head = hdSub(nm(S.barber), "back"); body = viewCalendar(); pct = 60; }
    else if (S.step === 5) {
      head = hdSub(nm(S.barber), "back"); body = viewTime(); pct = 75;
      act = (S.slot ? '<div class="sum">' + shortDate(S.date) + ", " + S.slot.slice(11, 16) + " – " + endTime() + "<small>" + esc(nm(S.barber)) + " · " + t("minutes", {n: totals().min}) + "</small></div>" : "") + '<button class="primary" data-a="to-confirm"' + (S.slot ? "" : " disabled") + ">" + t("next") + "</button>";
    }
    else { head = hdSub(t("contact"), "back"); body = viewConfirm(); pct = 90; act = '<button class="primary" id="b-ok" data-a="confirm"' + (phoneOk() ? "" : " disabled") + ">" + t("book_btn") + "</button>"; }
  } else if (v === "info") { head = hdSub(t("about", {name: nm(S.shop)}), "go-home"); body = viewInfo(); }
  else if (v === "mine") { head = hdSub(t("my_bookings"), "go-home"); body = viewMine(); }
  else if (v === "sched") { head = hdStaff(); body = viewSched(); }
  else if (v === "report") { head = hdStaff(); body = viewReport(); }
  else if (v === "settings") { head = hdStaff(); body = viewSettings(); }

  const navTabs = [["sched", "Jadval", "clock"], ["report", "Hisobot", "report"], ["settings", "Sozlamalar", "settings"], ["home", "Mijoz", "book"]];
  const navActive = (v === "info" || v === "mine") ? "home" : v;
  const nav = staff ? '<nav class="nav"><div>' + navTabs.map(x =>
    '<button class="' + (navActive === x[0] ? "on" : "") + '" data-a="tab" data-t="' + x[0] + '">' + icon(x[2]) + "<span>" + x[1] + "</span></button>").join("") + "</div></nav>" : "";

  const scrollX = document.querySelector(".strip") ? document.querySelector(".strip").scrollLeft : 0;
  $app.innerHTML = '<div class="bar"><i style="width:' + pct + '%"></i></div>' + head + body +
    (act ? '<div class="act' + (staff ? " hn" : "") + '"><div>' + act + "</div></div>" : "") + nav + modalHtml();
  const strip = document.querySelector(".strip");
  if (strip) {
    const on = strip.querySelector(".chip.on");
    if (scrollX) strip.scrollLeft = scrollX; else if (on) strip.scrollLeft = Math.max(0, on.offsetLeft - strip.clientWidth / 2 + on.clientWidth / 2);
  }
}

// ---------- loaders
const endTime = () => { const v = +S.slot.slice(11, 13) * 60 + +S.slot.slice(14, 16) + totals().min; return String(Math.floor(v / 60) % 24).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0"); };
const phoneOk = () => ((S.phone || (S.me && S.me.phone) || "").replace(/\D/g, "").length >= 9);
async function loadSlots() {
  const req = ++S.slotReq;
  S.slots = null; S.slot = null; S.hourOpen = null; render();
  try {
    const r = await api("/api/slots?date_=" + S.date + "&barber_id=" + S.barber.id + "&service_ids=" + S.picked.join(","));
    if (req !== S.slotReq) return;
    S.slotInfo = r; S.slots = r.slots;
  } catch (e) { if (req !== S.slotReq) return; S.slots = []; S.slotInfo = null; toast(errText(e), true); }
  render();
}
async function loadMine(scope) {
  scope = scope || S.mineScope;
  S.mine[scope] = null; render();
  try { S.mine[scope] = await api("/api/my-bookings?scope=" + scope); } catch (e) { S.mine[scope] = []; toast(errText(e), true); }
  render();
}
async function loadSched() {
  S.sched.list = null; render();
  try { S.sched.list = await api("/api/admin/bookings?date_=" + S.sched.date + "&branch_id=" + S.sched.branch); } catch (e) { S.sched.list = []; toast(errText(e), true); }
  render();
}
async function loadReport() {
  S.report.data = null; render();
  try { S.report.data = await api("/api/admin/report?period=" + S.report.period + "&branch_id=" + S.report.branch); }
  catch (e) { S.report.data = {revenue: 0, counts: {booked: 0, done: 0, no_show: 0, cancelled: 0}, by_service: []}; toast(errText(e), true); }
  render();
}
async function refreshBranches() {
  S.adminBranches = await api("/api/admin/branches");
  S.branches = S.adminBranches.filter(b => b.active);
}
async function loadHours() {
  S.set.hours = null; render();
  try { S.set.hours = S.set.hoursBranch ? await api("/api/admin/work-hours?branch_id=" + S.set.hoursBranch) : []; }
  catch (e) { S.set.hours = []; toast(errText(e), true); }
  render();
}
async function loadSettings() {
  S.set.services = null; S.set.hours = null; if (isOwner()) S.set.admins = null; render();
  try {
    const [sv, bs] = await Promise.all([api("/api/admin/services"), api("/api/admin/barbers"), refreshBranches()]);
    S.set.services = sv; S.adminBarbers = bs;
    if (isFull()) {
      if (!S.adminBranches.some(b => b.id === S.set.hoursBranch)) S.set.hoursBranch = S.adminBranches.length ? S.adminBranches[0].id : 0;
      S.set.hours = S.set.hoursBranch ? await api("/api/admin/work-hours?branch_id=" + S.set.hoursBranch) : [];
    } else S.set.hours = [];
    if (isOwner()) S.set.admins = await api("/api/admin/admins");
  } catch (e) {
    toast(errText(e), true);
    S.set.services = S.set.services || []; S.adminBarbers = S.adminBarbers || []; S.set.hours = S.set.hours || [];
    S.adminBranches = S.adminBranches || []; if (isOwner() && !S.set.admins) S.set.admins = [];
  }
  render();
}

function resetBook() { S.step = 1; S.branch = null; S.barber = null; S.picked = []; S.phone = ""; S.slots = null; S.slot = null; S.date = ymd(0); S.done = null; }
function openView(v) {
  S.view = v;

  else if (v === "info") render();

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el || !H[el.dataset.a]) return;
  H[el.dataset.a](el.dataset, el);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("role") === "button") { e.preventDefault(); e.target.click(); }
});

document.addEventListener("input", e => {
  if (e.target.id !== "f-ph") return;
  S.phone = e.target.value;
  const b = document.getElementById("b-ok"); if (b) b.disabled = !phoneOk();
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.file) {
    const f = el.files && el.files[0];
    if (!f || !S.modal) return;
    try {
      const logo = el.dataset.file === "logo";
      const data = await fileToDataUrl(f, logo ? 256 : 900, logo ? "image/png" : "image/jpeg", 0.78);
      if (data.length > 850000) { toast("Rasm juda katta. Kichikroq rasm tanlang.", true); return; }
      S.modal.pending = data;
      const prev = document.getElementById("f-prev");
      prev.src = data; prev.style.display = "block";
    } catch (err) { toast("Rasmni o'qib bo'lmadi", true); }
    return;
  }
  if (el.dataset.h === undefined) return;
  const i = Number(el.dataset.h);
  const q = f => document.querySelector('[data-h="' + i + '"][data-f="' + f + '"]');
  const off = q("off").checked, st = q("start").value, en = q("end").value;
  if (!off && (!st || !en || st >= en)) { toast("Boshlanish vaqti tugashdan oldin bo'lishi kerak", true); return; }
  try {
    await api("/api/admin/work-hours/" + S.set.hoursBranch + "/" + i, {method: "PUT", body: off ? {is_off: true} : {is_off: false, start_time: st, end_time: en}});
    const row = S.set.hours.find(x => x.weekday === i);
    if (row) { row.is_off = off; if (!off) { row.start_time = st; row.end_time = en; } else { row.start_time = null; row.end_time = null; } }
    else S.set.hours.push({weekday: i, is_off: off, start_time: off ? null : st, end_time: off ? null : en});
    toast("Saqlandi"); render();
  } catch (err) { toast(errText(err), true); }
});

// ---------- boot
function screen(title, text, retry) {
  $app.innerHTML = '<div class="bar"><i style="width:100%"></i></div><div class="center"><h1>' + esc(title) + "</h1><p class='sub'>" + esc(text) + "</p>" +
    (retry ? '<button class="ghost" data-a="retry">' + t("retry") + "</button>" : "") + "</div>";
}

async function boot() {
  if (tg) { tg.ready(); tg.expand(); }
  applyTheme();
  if (API_BASE.indexOf("YOUR-SERVICE") !== -1) { screen(t("setup_title"), t("setup_text"), false); return; }
  screen(t("loading"), t("wait"), false);
  const slow = setTimeout(() => screen(t("waking"), t("waking_sub"), false), 5000);
  try {
    const b = await api("/api/bootstrap");
    S.me = b.me; S.shop = b.shop; S.branches = b.branches; S.services = b.services; S.barbers = b.barbers || [];
    S.lang = b.me.lang || S.lang; store("lang", S.lang);
    if (isStaff()) S.adminBranches = await api("/api/admin/branches");
  } catch (e) {
    clearTimeout(slow);
    screen(t("failed"), errText(e), true);
    return;
  }
  clearTimeout(slow);
  applyTheme();
  document.title = nm(S.shop);
  S.view = isStaff() ? "sched" : "home";
  if (S.view === "sched") loadSched(); else render();
}
boot();
</script>
</body>
</html>
